b{width:285px;height:335px;position:relative;display:grid;place-items:center;border-radius:48% 48% 45% 45%;background:radial-gradient(circle at 35% 30%,#fff9ff,#dfc4f1 48%,#b9c5ee);box-shadow:inset 0 0 40px #ffffffc9,0 35px 65px #a775bd30;border:1px solid #fff;transform:rotate(-9deg)}.orb:before,.orb:after{content:'';position:absolute;border:1px solid #b69bc777;width:370px;height:200px;border-radius:50%;transform:rotate(-30deg)}.orb:after{transform:rotate(60deg);width:310px;height:400px}.wing{position:absolute;width:94px;height:146px;border:2px solid #fff9;border-radius:90% 15% 80% 20%;background:linear-gradient(135deg,#ffffffc9,#ffffff1a);box-shadow:0 0 24px #fff8;transform:rotate(-30deg);left:57px;top:78px}.wing.right{transform:scaleX(-1) rotate(-30deg);left:141px}.wing.small{top:177px;left:89px;width:60px;height:80px;transform:rotate(-80deg)}.wing.small.right{left:140px;transform:scaleX(-1) rotate(-80deg)}.star{font-size:75px;color:#fff;z-index:2;text-shadow:0 0 30px #fff;transform:rotate(9deg)}.float{position:absolute;background:#fffafde8;border:1px solid #fff;border-radius:30px;padding:11px 17px;font-size:12px;box-shadow:0 9px 30px #916b9b12;z-index:3}.f1{top:45px;left:20px;transform:rotate(-9deg)}.f2{top:110px;right:-5px;transform:rotate(8deg)}.f3{bottom:65px;left:10px;transform:rotate(-6deg)}.f4{bottom:22px;right:20px;transform:rotate(7deg)}.spark{position:absolute;color:#ad77bc;font-size:30px}.s1{top:0;right:80px}.s2{bottom:16px;left:100px;font-size:19px}.roster{margin-top:40px;padding-top:30px;border-top:1px solid var(--line)}.roster-label{text-align:center;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:24px}.fairies{display:flex;justify-content:space-around;gap:16px}.fairy{text-align:center;font-size:12px}.badge{display:grid;place-items:center;width:47px;height:47px;margin:0 auto 9px;border-radius:50%;background:var(--c);font-size:23px;border:3px solid #fff9}.fairy small{display:block;font-size:10px;color:var(--muted);margin-top:4px}footer{text-align:center;font-size:10px;line-height:1.8;color:var(--muted);padding:35px 20px 22px}.quiz{max-width:740px;margin:auto;min-height:520px}.topline{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:15px}.progress{height:5px;border-radius:9px;background:#e9ddec;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,#bd6caa,#8c82ca);transition:width .3s}.qcard{background:var(--paper);border:1px solid #fff;border-radius:28px;padding:35px;margin-top:28px;box-shadow:0 18px 50px #75498709}.qcard h2{font-size:27px;line-height:1.4;margin:10px 0 25px;letter-spacing:-1px}.options{display:grid;gap:10px}.option{display:flex;text-align:left;align-items:center;gap:14px;width:100%;padding:15px;border:1px solid var(--line);border-radius:14px;background:white;color:var(--ink);font-size:14px;transition:background .15s,border-color .15s}.option:hover{background:#faf0fa;border-color:#c599c2}.option[aria-pressed=true]{background:#f1e0f2;border-color:#af6fa4}.letter{display:grid;place-items:center;border-radius:50%;width:28px;height:28px;background:#f5eff7;flex-shrink:0;font-size:11px;color:var(--muted)}.navigation{display:flex;justify-content:space-between;align-items:center;margin-top:22px}.ghost{border:0;background:transparent;color:var(--muted);padding:12px}.result{text-align:center;max-width:700px;margin:auto}.result h1{font-size:52px;margin:14px 0}.result .eyebrow{justify-content:center}.result-icon{font-size:68px;width:134px;height:134px;display:grid;place-items:center;margin:22px auto;border-radius:50%;background:var(--c);border:7px solid white;box-shadow:0 15px 40px #ab75b529}.result p{color:var(--muted);line-height:1.85}.traits{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:20px 0}.traits span{border:1px solid var(--line);border-radius:30px;padding:7px 12px;font-size:12px;background:#fff8}.result-box{padding:25px;background:var(--paper);border:1px solid white;border-radius:24px;margin:25px 0}.result-box p{margin:8px 0}.breakdown{text-align:left;display:grid;gap:12px;margin-top:20px}.score{display:grid;grid-template-columns:75px 1fr 35px;align-items:center;gap:12px;font-size:12px}.track{height:7px;background:#efe5f0;border-radius:8px;overflow:hidden}.track i{display:block;height:100%;background:#bd81b3;border-radius:8px}.notice{font-size:12px;min-height:22px;margin-top:14px}.sharelink{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;color:var(--ink);margin-top:10px}.hidden{display:none!important}@media(max-width:700px){header{padding:20px}.edition{font-size:9px;letter-spacing:1px}.brand{font-size:16px}main{padding:30px 22px 15px}.hero{grid-template-columns:1fr;gap:0;text-align:center}.eyebrow{justify-content:center}h1{font-size:49px}.lead{margin:0 auto;font-size:14px}.art{height:330px;margin-top:26px}.orb{width:210px;height:250px}.orb:before{width:280px;height:160px}.orb:after{width:230px;height:290px}.wing{left:24px;top:40px}.wing.right{left:105px}.wing.small{left:54px;top:143px}.wing.small.right{left:103px}.f1{top:14px;left:0}.f2{top:70px;right:0}.f3{bottom:44px;left:0}.f4{bottom:5px;right:0}.float{font-size:10px;padding:9px 12px}.fairies{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.roster{margin-top:24px}.qcard{padding:23px 17px;border-radius:22px}.qcard h2{font-size:23px}.primary{padding:16px 23px}.result h1{font-size:42px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body><header><a class="brand" href="./"><span>✦</span>искра алфеи</a><div class="edition">a little bit of magic</div></header><main id="app"></main><footer>Создано для тех, кто всё ещё верит в магию ✧<br>Неофициальный фан-квиз по Winx Club. Для развлечения, без регистрации и сбора ответов.</footer>
<script>
'use strict';
const fairies=[
{id:'bloom',name:'Блум',power:'Огонь Дракона',icon:'🔥',color:'#ffe1d6',traits:['Смелость','Верность','Внутренний огонь'],text:'В тебе живёт искра, которая зажигает других. Ты не проходишь мимо несправедливости и готова первой шагнуть в неизвестность. Как Блум, ты умеешь находить силы, даже когда кажется, что их уже нет.',tip:'Твоя магия становится сильнее, когда ты доверяешь друзьям. Не обязательно спасать весь мир в одиночку.'},
{id:'stella',name:'Стелла',power:'Солнце и Луна',icon:'☀️',color:'#ffedc6',traits:['Харизма','Оптимизм','Чувство стиля'],text:'Ты приносишь свет даже в самый пасмурный день. В тебе сочетаются любовь к красоте, щедрость и умение превратить обычную встречу в событие. За яркостью Стеллы, как и за твоей, стоит большое сердце.',tip:'Не прячь настоящие чувства за улыбкой. Те, кто тебя любит, хотят быть рядом и в солнечные, и в облачные дни.'},
{id:'flora',name:'Флора',power:'Магия природы',icon:'🌸',color:'#f5ddeb',traits:['Чуткость','Терпение','Забота'],text:'Рядом с тобой можно выдохнуть и быть собой. Ты замечаешь то, что другие пропускают, умеешь слушать и находишь красоту в простых вещах. Твоя мягкость, как у Флоры, — настоящая сила.',tip:'Оставляй немного заботы и для себя. Твои желания так же важны, как желания тех, кого ты поддерживаешь.'},
{id:'musa',name:'Муза',power:'Магия музыки',icon:'🎵',color:'#e7defb',traits:['Искренность','Творчество','Глубина'],text:'Ты чувствуешь мир на своей частоте. Музыка, настроение и честные разговоры значат для тебя больше красивых обещаний. Как Муза, ты умеешь превращать сильные чувства во что-то прекрасное.',tip:'Дай другим услышать тебя. Иногда один честный разговор говорит больше, чем самый точный плейлист.'},
{id:'tecna',name:'Текна',power:'Магия технологий',icon:'💎',color:'#dcdfFA',traits:['Любознательность','Логика','Надёжность'],text:'Там, где остальные видят хаос, ты находишь закономерность. Ты любишь разбираться, проверять идеи и придумывать решения. Как Текна, ты выражаешь заботу делами — и на тебя можно положиться.',tip:'Не у каждого чувства есть формула. Иногда можно выбрать то, что радует, даже если это не самый рациональный вариант.'},
{id:'aisha',name:'Лейла',power:'Магия волн',icon:'🌊',color:'#d4eee9',traits:['Независимость','Энергия','Решительность'],text:'Твоя стихия — движение. Ты не боишься пробовать, отстаиваешь свободу и поддерживаешь тех, кто рядом. В тебе есть упорство Лейлы: упасть, подняться и попробовать ещё раз.',tip:'Отдых — тоже часть движения вперёд. Разрешай себе остановиться и принять помощь.'}
];
const questions=[
['Впереди свободный день. Какой план?', ['Отправиться туда, где ещё не была','Нарядиться и устроить праздник с друзьями','Пикник в тихом месте среди зелени','Концерт или вечер с любимой музыкой','Разобраться в новой интересной штуке','Прогулка, танцы или активное приключение']],
['В команде случилась неприятность. Ты…',['Беру инициативу и защищаю своих','Поднимаю настроение, чтобы не опускали руки','Слушаю каждого и помогаю договориться','Честно говорю о том, что все чувствуют','Разбираю причины и составляю план','Сразу включаюсь и помогаю делом']],
['Какой подарок особенно тебя порадует?',['Впечатление, о котором давно мечтала','Красивый аксессуар, выбранный специально для меня','Что-то сделанное руками с заботой','Билет на концерт любимого исполнителя','Полезный гаджет или необычная головоломка','Поездка к морю или новое спортивное хобби']],
['Какая фраза ближе всего?',['«Я попробую, даже если страшно»','«Добавим этому дню немного блеска»','«Давай я побуду рядом»','«Мне важно оставаться собой»','«Давай разберёмся, как это работает»','«Меньше слов — больше движения»']],
['Тебе предстоит новое дело. С чего начнёшь?',['Вспомню, ради чего мне это нужно','Представлю, каким классным будет результат','Найду комфортный темп и поддержку','Поищу идею, которая меня по-настоящему цепляет','Соберу информацию и проверю детали','Попробую на практике и разберусь по ходу']],
['Выбери место, где хочется перезагрузиться.',['Костёр под звёздами','Солнечная терраса с красивым видом','Сад, полный цветов','Уютная комната с винилом и наушниками','Тихое пространство с книгами и проектами','Берег моря с шумом прибоя']],
['Что ты особенно ценишь в дружбе?',['Верность, даже когда всё сложно','Умение радоваться жизни вместе','Внимание к чувствам друг друга','Возможность говорить честно','Надёжность и взаимопонимание','Уважение к свободе и общие приключения']],
['Планы внезапно поменялись. Твоя реакция?',['Найду новый путь к тому, что важно','Превращу неожиданность в маленький праздник','Убедюсь, что всем комфортно','Сначала дам себе время прожить эмоции','Быстро пересчитаю варианты','Легко переключусь: действуем по ситуации']],
['Какая суперспособность тебе ближе?',['Зажигать надежду в людях','Освещать всё вокруг','Исцелять и выращивать жизнь','Передавать чувства мелодией','Понимать любые сложные системы','Управлять водой и свободно двигаться']],
['За что тебя чаще благодарят?',['За смелость заступиться','За настроение и вдохновение','За доброту и поддержку','За искренность и необычный взгляд','За полезный совет и точное решение','За помощь и умение не сдаваться']],
['Как ты справляешься с трудным днём?',['Вспоминаю свою цель и собираюсь с силами','Нахожу маленькую радость для себя','Замедляюсь и забочусь о себе','Включаю музыку под настроение','Раскладываю мысли по полочкам','Снимаю напряжение в движении']],
['Что хочется привнести в мир?',['Больше смелости быть собой','Больше света и красоты','Больше тепла и бережности','Больше творчества и честности','Больше знаний и полезных открытий','Больше свободы и возможностей']]
];
const app=document.querySelector('#app');let answers=[],step=0,order=[],currentResult=null;
function renderHome(){currentResult=null;app.innerHTML=`<section class="hero"><div><div class="eyebrow">Твоя магия уже внутри</div><h1>Кто ты<br>из <em>Винкс?</em></h1><p class="lead">Огонь Блум, нежность Флоры или энергия Лейлы? Узнай, какая фея живёт в тебе.</p><button class="primary start" id="start">Найти свою магию <span>↗</span></button><div class="micro">12 вопросов · 3 минуты · только твои ощущения</div></div><div class="art" aria-hidden="true"><span class="spark s1">✧</span><span class="spark s2">✦</span><div class="orb"><i class="wing"></i><i class="wing right"></i><i class="wing small"></i><i class="wing small right"></i><span class="star">✦</span></div><span class="float f1">🌸 немножко нежности</span><span class="float f2">✨ щепотка сияния</span><span class="float f3">🔥 искра смелости</span><span class="float f4">и целая вселенная тебя</span></div></section><section class="roster"><div class="roster-label">Шесть фей. Шесть стихий. Какая — твоя?</div><div class="fairies">${fairies.map(f=>`<div class="fairy"><div class="badge" style="--c:${f.color}">${f.icon}</div>${f.name}<small>${f.power}</small></div>`).join('')}</div></section>`;document.querySelector('#start').onclick=startQuiz;}
function startQuiz(){answers=[];step=0;order=questions.map(()=>[0,1,2,3,4,5].map(i=>({i,r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.i));history.replaceState(null,'',location.pathname+location.search);renderQuestion();}
function focusTitle(){const title=app.querySelector('h1,h2');title.tabIndex=-1;title.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function renderQuestion(){const q=questions[step];app.innerHTML=`<section class="quiz"><div class="topline"><span>Открываем твою магию</span><span>Вопрос ${step+1} из ${questions.length}</span></div><div class="progress" role="progressbar" aria-label="Прогресс квиза" aria-valuemin="0" aria-valuemax="12" aria-valuenow="${step}"><div style="width:${step/12*100}%"></div></div><div class="qcard"><div class="eyebrow">Прислушайся к себе</div><h2>${q[0]}</h2><div class="options" role="group" aria-label="Варианты ответа">${order[step].map((idx,pos)=>`<button class="option" data-answer="${idx}" aria-pressed="${answers[step]===idx}"><span class="letter">${pos+1}</span><span>${q[1][idx]}</span></button>`).join('')}</div><div class="navigation"><button class="ghost" id="back">${step?'← Назад':'← На главную'}</button><button class="primary" id="next" ${answers[step]===undefined?'disabled':''}>${step===11?'Узнать результат':'Дальше'} <span>→</span></button></div></div></section>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answers[step]=Number(b.dataset.answer);app.querySelectorAll('[data-answer]').forEach(o=>o.setAttribute('aria-pressed',String(o===b)));document.querySelector('#next').disabled=false;});document.querySelector('#back').onclick=()=>{if(step){step--;renderQuestion();}else renderHome();};document.querySelector('#next').onclick=()=>{if(answers[step]===undefined)return;if(step<11){step++;renderQuestion();}else showResult(calculate(answers),false);};focusTitle();}
function calculate(values){const scores=Array(6).fill(0);values.forEach(v=>scores[v]++);const max=Math.max(...scores);const tied=scores.map((n,i)=>n===max?i:-1).filter(i=>i>=0);const winner=values.find(v=>tied.includes(v));return {winner,scores};}
function showResult(data,shared){currentResult=data;const f=fairies[data.winner];history.replaceState(null,'','#'+f.id);app.innerHTML=`<section class="result"><div class="eyebrow">${shared?'Магия, которой с тобой поделились':'Твоя магия раскрыта'}</div><div class="result-icon" style="--c:${f.color}">${f.icon}</div><h1>${shared?'Это':'Ты —'} ${f.name}!</h1><div class="edition">${f.power}</div><div class="traits">${f.traits.map(t=>`<span>${t}</span>`).join('')}</div><p>${f.text}</p><div class="result-box"><strong>Маленькое напоминание от твоей феи</strong><p>${f.tip}</p>${data.scores?`<div class="breakdown" aria-label="Распределение ответов">${fairies.map((item,i)=>`<div class="score"><span>${item.name}</span><div class="track"><i style="width:${data.scores[i]/12*100}%"></i></div><span>${data.scores[i]}/12</span></div>`).join('')}</div><p style="font-size:11px;margin-top:16px">Это распределение твоих ответов, а не оценка личности. При равенстве решает первый ответ в пользу одной из лидирующих фей.</p>`:''}</div><button class="primary" id="share">Поделиться магией <span>↗</span></button> <button class="ghost" id="restart">${shared?'Узнать свою фею':'Пройти ещё раз'} ↻</button><div class="notice" role="status" id="notice"></div><input class="sharelink hidden" id="sharelink" aria-label="Ссылка на результат" readonly></section>`;document.querySelector('#restart').onclick=startQuiz;document.querySelector('#share').onclick=shareResult;focusTitle();}
async function shareResult(){const f=fairies[currentResult.winner];const url=location.href;const notice=document.querySelector('#notice');try{if(navigator.share){await navigator.share({title:'Искра Алфеи — кто ты из Винкс?',text:`Моя фея — ${f.name}! А кто ты из Винкс? ✨`,url});notice.textContent='Магия отправлена ✨';}else{await navigator.clipboard.writeText(url);notice.textContent='Ссылка скопирована. Отправь её друзьям ✨';}}catch(err){if(err.name==='AbortError')return;const input=document.querySelector('#sharelink');input.value=url;input.classList.remove('hidden');input.select();notice.textContent='Скопируй эту ссылку и отправь друзьям:';}}
const sharedIndex=fairies.findIndex(f=>location.hash==='#'+f.id);if(sharedIndex>=0)showResult({winner:sharedIndex},true);else renderHome();
</script></body></html>
