  ],
  [
    "Финал сезона. Чтобы открыть портал домой, нужно оставить в Алфее одну свою черту. С чем труднее всего расстаться?",
    [
      "С привычкой лезть в невозможное. Без неё я столько всего не нашла бы.",
      "С желанием быть замеченной. Мне нравится занимать место в этом мире.",
      "С тем, как близко я принимаю всё к сердцу. Даже если иногда от этого больно.",
      "С упрямством быть собой. Даже когда со мной неудобно.",
      "С потребностью во всём разобраться. Не хочу просто верить на слово.",
      "С нежеланием зависеть от чужого разрешения. Даже ради спокойной жизни."
    ]
  ]
];
const app=document.querySelector('#app');let answers=[],step=0,order=[],currentResult=null;
function renderHome(){currentResult=null;app.innerHTML=`<section class="hero"><div><div class="eyebrow">Твоя магия уже внутри</div><h1>Кто ты<br>из <em>Винкс?</em></h1><p class="lead">Заколдованное платье, девятый сезон с бывшим и сделка с зеркалом. Как ты выкрутишься — и какая фея в тебе проснётся?</p><button class="primary start" id="start">Найти свою магию <span>↗</span></button><div class="micro">12 ситуаций · 4 минуты · идеальных ответов нет</div></div><div class="art" aria-hidden="true"><span class="spark s1">✧</span><span class="spark s2">✦</span><div class="orb"><i class="wing"></i><i class="wing right"></i><i class="wing small"></i><i class="wing small right"></i><span class="star">✦</span></div><span class="float f1">🌸 немножко нежности</span><span class="float f2">✨ щепотка сияния</span><span class="float f3">🔥 искра смелости</span><span class="float f4">и целая вселенная тебя</span></div></section><section class="roster"><div class="roster-label">Шесть фей. Шесть стихий. Какая — твоя?</div><div class="fairies">${fairies.map(f=>`<div class="fairy"><div class="badge" style="--c:${f.color}">${f.icon}</div>${f.name}<small>${f.power}</small></div>`).join('')}</div></section>`;document.querySelector('#start').onclick=startQuiz;}
function startQuiz(){answers=[];step=0;order=questions.map(()=>[0,1,2,3,4,5].map(i=>({i,r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.i));history.replaceState(null,'',location.pathname+location.search);renderQuestion();}
function focusTitle(){const title=app.querySelector('h1,h2');title.tabIndex=-1;title.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function renderQuestion(){const q=questions[step];app.innerHTML=`<section class="quiz"><div class="topline"><span>Открываем твою магию</span><span>Вопрос ${step+1} из ${questions.length}</span></div><div class="progress" role="progressbar" aria-label="Прогресс квиза" aria-valuemin="0" aria-valuemax="12" aria-valuenow="${step}"><div style="width:${step/12*100}%"></div></div><div class="qcard"><div class="eyebrow">А ты как поступишь?</div><h2>${q[0]}</h2><div class="options" role="group" aria-label="Варианты ответа">${order[step].map((idx,pos)=>`<button class="option" data-answer="${idx}" aria-pressed="${answers[step]===idx}"><span class="letter">${pos+1}</span><span>${q[1][idx]}</span></button>`).join('')}</div><div class="navigation"><button class="ghost" id="back">${step?'← Назад':'← На главную'}</button><button class="primary" id="next" ${answers[step]===undefined?'disabled':''}>${step===11?'Узнать результат':'Дальше'} <span>→</span></button></div></div></section>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answers[step]=Number(b.dataset.answer);app.querySelectorAll('[data-answer]').forEach(o=>o.setAttribute('aria-pressed',String(o===b)));document.querySelector('#next').disabled=false;});document.querySelector('#back').onclick=()=>{if(step){step--;renderQuestion();}else renderHome();};document.querySelector('#next').onclick=()=>{if(answers[step]===undefined)return;if(step<11){step++;renderQuestion();}else showResult(calculate(answers),false);};focusTitle();}
function calculate(values){const scores=Array(6).fill(0);values.forEach(v=>scores[v]++);const max=Math.max(...scores);const tied=scores.map((n,i)=>n===max?i:-1).filter(i=>i>=0);const winner=values.find(v=>tied.includes(v));return {winner,scores};}
function showResult(data,shared){currentResult=data;const f=fairies[data.winner];history.replaceState(null,'','#'+f.id);app.innerHTML=`<section class="result"><div class="eyebrow">${shared?'Магия, которой с тобой поделились':'Твоя магия раскрыта'}</div><div class="result-icon" style="--c:${f.color}">${f.icon}</div><h1>${shared?'Это':'Ты —'} ${f.name}!</h1><div class="edition">${f.power}</div><div class="traits">${f.traits.map(t=>`<span>${t}</span>`).join('')}</div><p>${f.text}</p><div class="result-box"><strong>Маленькое напоминание от твоей феи</strong><p>${f.tip}</p>${data.scores?`<div class="breakdown" aria-label="Распределение ответов">${fairies.map((item,i)=>`<div class="score"><span>${item.name}</span><div class="track"><i style="width:${data.scores[i]/12*100}%"></i></div><span>${data.scores[i]}/12</span></div>`).join('')}</div><p style="font-size:11px;margin-top:16px">Это распределение твоих ответов, а не оценка личности. При равенстве решает первый ответ в пользу одной из лидирующих фей.</p>`:''}</div><button class="primary" id="share">Поделиться магией <span>↗</span></button> <button class="ghost" id="restart">${shared?'Узнать свою фею':'Пройти ещё раз'} ↻</button><div class="notice" role="status" id="notice"></div><input class="sharelink hidden" id="sharelink" aria-label="Ссылка на результат" readonly></section>`;document.querySelector('#restart').onclick=startQuiz;document.querySelector('#share').onclick=shareResult;focusTitle();}
async function shareResult(){const f=fairies[currentResult.winner];const url=location.href;const notice=document.querySelector('#notice');try{if(navigator.share){await navigator.share({title:'Искра Алфеи — кто ты из Винкс?',text:`Моя фея — ${f.name}! А кто ты из Винкс? ✨`,url});notice.textContent='Магия отправлена ✨';}else{await navigator.clipboard.writeText(url);notice.textContent='Ссылка скопирована. Отправь её друзьям ✨';}}catch(err){if(err.name==='AbortError')return;const input=document.querySelector('#sharelink');input.value=url;input.classList.remove('hidden');input.select();notice.textContent='Скопируй эту ссылку и отправь друзьям:';}}
const sharedIndex=fairies.findIndex(f=>location.hash==='#'+f.id);if(sharedIndex>=0)showResult({winner:sharedIndex},true);else renderHome();
</script></body></html>
