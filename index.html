<script>
'use strict';
const fairies=[
{id:'bloom',name:'Блум',power:'Огонь Дракона',icon:'🔥',color:'#ffe1d6',traits:['Смелость','Верность','Внутренний огонь'],text:'В тебе живёт искра, которая зажигает других. Ты не проходишь мимо несправедливости и готова первой шагнуть в неизвестность. Как Блум, ты умеешь находить силы, даже когда кажется, что их уже нет.',tip:'Твоя магия становится сильнее, когда ты доверяешь друзьям. Не обязательно спасать весь мир в одиночку.'},
{id:'stella',name:'Стелла',power:'Солнце и Луна',icon:'☀️',color:'#ffedc6',traits:['Харизма','Оптимизм','Чувство стиля'],text:'Ты приносишь свет даже в самый пасмурный день. В тебе сочетаются любовь к красоте, щедрость и умение превратить обычную встречу в событие. За яркостью Стеллы, как и за твоей, стоит большое сердце.',tip:'Не прячь настоящие чувства за улыбкой. Те, кто тебя любит, хотят быть рядом и в солнечные, и в облачные дни.'},
{id:'flora',name:'Флора',power:'Магия природы',icon:'🌸',color:'#f5ddeb',traits:['Чуткость','Терпение','Забота'],text:'Рядом с тобой можно выдохнуть и быть собой. Ты замечаешь то, что другие пропускают, умеешь слушать и находишь красоту в простых вещах. Твоя мягкость, как у Флоры, — настоящая сила.',tip:'Оставляй немного заботы и для себя. Твои желания так же важны, как желания тех, кого ты поддерживаешь.'},
{id:'musa',name:'Муза',power:'Магия музыки',icon:'🎵',color:'#e7defb',traits:['Искренность','Творчество','Глубина'],text:'Ты чувствуешь мир на своей частоте. Музыка, настроение и честные разговоры значат для тебя больше красивых обещаний. Как Муза, ты умеешь превращать сильные чувства во что-то прекрасное.',tip:'Дай другим услышать тебя. Иногда один честный разговор говорит больше, чем самый точный плейлист.'},
{id:'tecna',name:'Текна',power:'Магия технологий',icon:'💎',color:'#dcdfFA',traits:['Любознательность','Логика','Надёжность'],text:'Там, где остальные видят хаос, ты находишь закономерность. Ты любишь разбираться, проверять идеи и придумывать решения. Как Текна, ты выражаешь заботу делами — и на тебя можно положиться.',tip:'Не у каждого чувства есть формула. Иногда можно выбрать то, что радует, даже если это не самый рациональный вариант.'},
{id:'aisha',name:'Лейла',power:'Магия волн',icon:'🌊',color:'#d4eee9',traits:['Независимость','Энергия','Решительность'],text:'Твоя стихия — движение. Ты не боишься пробовать, отстаиваешь свободу и поддерживаешь тех, кто рядом. В тебе есть упорство Лейлы: упасть, подняться и попробовать ещё раз.',tip:'Отдых — тоже часть движения вперёд. Разрешай себе остановиться и принять помощь.'}
];
const questions=[
  ["Тебе предлагают дело, о котором ты давно думала. Ответ нужен сегодня, а половина условий пока неизвестна. Что ближе к твоей реальной реакции?",[
    {"text":"Соглашусь на первый шаг, если смогу выйти после него. Начать проще, чем продолжать гадать.","weights":[3,0,0,0,1,2]},
    {"text":"Попрошу один конкретный ответ, от которого всё зависит. Остальное готова выяснять по ходу.","weights":[1,0,0,1,4,0]},
    {"text":"Обсужу с человеком, который знает меня в неудачные дни. Хочу понять, потяну ли это, когда пройдёт восторг.","weights":[0,1,3,2,0,0]},
    {"text":"Соглашусь, если смогу изменить формат под себя. Иначе даже хорошая возможность быстро станет чужой жизнью.","weights":[0,2,0,1,0,3]}
  ]],
  ["В компании твою идею почти не заметили. Через десять минут другой человек предложил то же самое — и все оживились. Что ты скорее сделаешь?",[
    {"text":"Подхвачу обсуждение и добавлю детали, которые были у меня с самого начала. Пусть станет понятно без отдельной разборки.","weights":[2,3,1,0,0,0]},
    {"text":"Скажу: «Да, это то, что я предлагала». Хочу продолжить разговор, но не делать вид, что меня здесь не было.","weights":[1,1,0,3,0,1]},
    {"text":"Посмотрю, чем его подача сработала лучше. Если идея пройдёт, к вопросу авторства вернусь отдельно.","weights":[1,0,1,0,4,0]},
    {"text":"В этот раз не стану возвращать внимание. Но в следующий проект с этими людьми вложусь осторожнее.","weights":[0,0,2,2,0,2]}
  ]],
  ["Поездка с друзьями уже оплачена. За день до неё ты понимаешь, что мечтаешь побыть одна. Деньги не вернут. Какой компромисс выберешь?",[
    {"text":"Поеду, но заранее оставлю себе часть дня отдельно. Не хочу ни исчезать, ни играть бодрость все выходные.","weights":[0,1,2,0,0,3]},
    {"text":"Откажусь и помогу найти замену. Потеря денег неприятна, но сейчас поездка обойдётся мне дороже.","weights":[1,0,0,2,0,3]},
    {"text":"Поеду и скажу, что я не в ресурсе. Возможно, мне нужна не изоляция, а компания, в которой не надо стараться.","weights":[0,1,3,2,0,0]},
    {"text":"Сначала уберу из плана всё необязательное. Хочу проверить, устала ли я от самой поездки или от её расписания.","weights":[1,0,1,0,4,0]}
  ]],
  ["Близкий человек отвечает тебе заметно суше, чем обычно. На вопрос «всё нормально?» говорит «да». Что происходит дальше?",[
    {"text":"Дам время, но сама останусь на связи как обычно. Не хочу превращать каждую перемену тона в проверку отношений.","weights":[0,1,3,0,0,2]},
    {"text":"Скажу, что замечаю дистанцию и начинаю додумывать. Лучше один неловкий разговор, чем несколько дней догадок.","weights":[2,0,1,3,0,0]},
    {"text":"Немного отступлю и посмотрю, появится ли инициатива с его стороны. Не хочу вытягивать близость одна.","weights":[0,0,0,2,1,3]},
    {"text":"Предложу встретиться по конкретному поводу. В переписке легко ошибиться, а рядом станет понятнее.","weights":[1,2,1,0,2,0]}
  ]],
  ["Тебя хвалят за результат, которым ты сама не очень довольна. Какое продолжение этой сцены наиболее знакомо?",[
    {"text":"Поблагодарю и не стану объяснять недочёты. Хочу научиться принимать хорошее, даже когда вижу, что можно лучше.","weights":[0,3,1,1,1,0]},
    {"text":"Уточню, что именно сработало. Возможно, я оцениваю работу по критерию, который другим вообще не важен.","weights":[0,1,1,0,4,0]},
    {"text":"Упомяну человека, без которого не получилось бы. Мне неловко забирать всю похвалу, даже если основную работу сделала я.","weights":[1,1,3,1,0,0]},
    {"text":"Приму похвалу, но решение о качестве оставлю за собой. Одобрение приятно, переделать всё равно хочется.","weights":[0,0,0,3,1,2]}
  ]],
  ["Ты устала, а небольшая просьба внезапно становится последней каплей. Что вероятнее всего случится в первые десять минут?",[
    {"text":"Сделаю быстро, чтобы просьба исчезла. Раздражение замечу уже потом, когда останусь одна.","weights":[2,0,3,0,1,0]},
    {"text":"Скажу жёстче, чем собиралась, а затем захочу объяснить, что дело не только в этой просьбе.","weights":[2,0,0,3,0,1]},
    {"text":"Начну уточнять сроки и объём. Если разложить просьбу на части, станет легче понять, от чего я сейчас отказываюсь.","weights":[0,0,1,0,4,1]},
    {"text":"Отойду, прежде чем отвечать. Лучше немного повиснет пауза, чем я соглашусь или откажу на раздражении.","weights":[0,1,0,2,0,3]}
  ]],
  ["Ты узнаёшь, что приятели встретились без тебя. Они ничего не скрывали — просто не позвали. Какая мысль задержится дольше остальных?",[
    {"text":"«Мне было бы приятно, если бы обо мне вспомнили». Не катастрофа, но делать вид, что совсем не задело, не хочется.","weights":[0,2,2,2,0,0]},
    {"text":"«Может, я сама последнее время выгляжу недоступной?» Посмотрю, как отвечала на предыдущие приглашения.","weights":[1,1,1,0,3,0]},
    {"text":"«У нас могут быть разные круги». Неприятный укол переживу, но не хочу, чтобы все встречи стали обязательными для всех.","weights":[0,0,1,2,0,3]},
    {"text":"«Хочу понять, это случайность или что-то изменилось». Предложу свою встречу и посмотрю на отклик.","weights":[2,2,0,0,2,0]}
  ]],
  ["Ты можешь исправить чужую ошибку за вечер. Если не вмешаешься, человеку придётся отвечать за неё самому. Что сильнее влияет на твоё решение?",[
    {"text":"Заденет ли ошибка тех, кто в ней не виноват. Если да, сначала помогу, а границы обсудим после.","weights":[3,0,2,0,1,0]},
    {"text":"Просил ли человек о помощи. Без этого легко незаметно забрать у него и ответственность, и право разобраться.","weights":[0,0,2,1,0,3]},
    {"text":"Повторяется ли такое. Разовая помощь и роль постоянной страховки для меня разные вещи.","weights":[0,0,1,1,3,1]},
    {"text":"Смогу ли помочь открыто. Не хочу молча спасать ситуацию, а потом ждать, что это сами заметят.","weights":[1,2,0,3,0,0]}

const app=document.querySelector('#app');let answers=[],step=0,order=[],currentResult=null;
function renderHome(){currentResult=null;app.innerHTML=`<section class="hero"><div><div class="eyebrow">Твоя магия уже внутри</div><h1>Кто ты<br>из <em>Винкс?</em></h1><p class="lead">Что ты выбираешь, когда нет удобного ответа? Разбери свои привычки в отношениях, решениях и стрессе — и узнай, с какой феей у тебя больше общего.</p><button class="primary start" id="start">Найти свою магию <span>↗</span></button><div class="micro">24 ситуации · 10 минут · результат с процентами</div></div><div class="art" aria-hidden="true"><span class="spark s1">✧</span><span class="spark s2">✦</span><div class="orb"><i class="wing"></i><i class="wing right"></i><i class="wing small"></i><i class="wing small right"></i><span class="star">✦</span></div><span class="float f1">🌸 немножко нежности</span><span class="float f2">✨ щепотка сияния</span><span class="float f3">🔥 искра смелости</span><span class="float f4">и целая вселенная тебя</span></div></section><section class="roster"><div class="roster-label">Шесть фей. Шесть стихий. Какая — твоя?</div><div class="fairies">${fairies.map(f=>`<div class="fairy"><div class="badge" style="--c:${f.color}">${f.icon}</div>${f.name}<small>${f.power}</small></div>`).join('')}</div></section>`;document.querySelector('#start').onclick=startQuiz;}
function startQuiz(){answers=[];step=0;order=questions.map(q=>q[1].map((_,i)=>({i,r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.i));history.replaceState(null,'',location.pathname+location.search);renderQuestion();}

function renderQuestion(){const q=questions[step];app.innerHTML=`<section class="quiz"><div class="topline"><span>Открываем твою магию</span><span>Вопрос ${step+1} из ${questions.length}</span></div><div class="progress" role="progressbar" aria-label="Прогресс квиза" aria-valuemin="0" aria-valuemax="${questions.length}" aria-valuenow="${step}"><div style="width:${step/questions.length*100}%"></div></div><div class="qcard"><div class="eyebrow">Выбирай то, что чаще бывает в жизни</div><h2>${q[0]}</h2><div class="options" role="group" aria-label="Варианты ответа">${order[step].map((idx,pos)=>`<button class="option" data-answer="${idx}" aria-pressed="${answers[step]===idx}"><span class="letter">${pos+1}</span><span>${q[1][idx].text}</span></button>`).join('')}</div><div class="navigation"><button class="ghost" id="back">${step?'← Назад':'← На главную'}</button><button class="primary" id="next" ${answers[step]===undefined?'disabled':''}>${step===questions.length-1?'Узнать результат':'Дальше'} <span>→</span></button></div></div></section>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answers[step]=Number(b.dataset.answer);app.querySelectorAll('[data-answer]').forEach(o=>o.setAttribute('aria-pressed',String(o===b)));document.querySelector('#next').disabled=false;});document.querySelector('#back').onclick=()=>{if(step){step--;renderQuestion();}else renderHome();};document.querySelector('#next').onclick=()=>{if(answers[step]===undefined)return;if(step<questions.length-1){step++;renderQuestion();}else showResult(calculate(answers),false);};focusTitle();}
function calculate(values){
  const questionSet=values.length===12?questions.slice(0,12):questions;
  if(values.length!==questionSet.length)throw new Error('incomplete answers');
  const raw=Array(6).fill(0), baseline=Array(6).fill(0);
  values.forEach((answer,q)=>{
    const selected=questionSet[q][1][answer];
    if(!selected)throw new Error('invalid answer');
    selected.weights.forEach((w,i)=>{raw[i]+=w;});
    questionSet[q][1].forEach(o=>o.weights.forEach((w,i)=>{baseline[i]+=w/questionSet[q][1].length;}));
  });
  const adjusted=raw.map((n,i)=>n/baseline[i]);
  const total=adjusted.reduce((a,b)=>a+b,0);
  const shares=adjusted.map(n=>n/total*100);
  const percentages=shares.map(Math.floor);
  const remainders=shares.map((n,i)=>({i,value:n-percentages[i]})).sort((a,b)=>b.value-a.value||a.i-b.i);
  const missing=100-percentages.reduce((a,b)=>a+b,0);
  remainders.slice(0,missing).forEach(r=>percentages[r.i]++);
  const ranking=shares.map((value,i)=>({i,value})).sort((a,b)=>b.value-a.value||a.i-b.i).map(x=>x.i);
  const leaders=ranking.filter(i=>Math.abs(shares[i]-shares[ranking[0]])<1e-9);
  return {winner:ranking[0],ranking,percentages,choices:[...values],leaders};
}

function decodeResultHash(hash){

  if(!match||match[2].length!==(match[1]==='1'?12:questions.length))return null;
  return Array.from(match[2],Number);
}

  const headline=full?`${f.name} — ${data.percentages[data.winner]}%`:f.name;
  const description=full?`${profileSummary[data.ranking[0]]} ${profileSummary[data.ranking[1]]}`:'Это ссылка на результат старой версии квиза. Пройди его заново, чтобы увидеть проценты.';
  app.innerHTML=`<section class="result"><div class="eyebrow">${shared?'Результат, которым поделились':'Твой результат'}</div><div class="result-icon" style="--c:${f.color}">${f.icon}</div><h1>${headline}</h1><div class="edition">${f.power}</div><p>${description}</p>${full?`<section class="result-box analysis-block"><h2>Из чего складывается результат</h2><div class="breakdown" aria-label="Доли фей в результате">${data.ranking.map(i=>`<div class="score"><span>${fairies[i].name}</span><div class="track"><i style="width:${data.percentages[i]}%"></i></div><span>${data.percentages[i]}%</span></div>`).join('')}</div><p class="method-note">Доли основаны на выбранных ответах и в сумме дают 100%.</p></section>`:''}<div class="result-actions"><button class="primary" id="share" ${full?'':'disabled'}>Поделиться результатом <span>↗</span></button><button class="ghost" id="restart">${shared?'Пройти самому':'Пройти ещё раз'} ↻</button></div><div class="notice hidden" role="status" id="notice"></div></section>`;
  document.querySelector('#restart').onclick=startQuiz;
  if(full)document.querySelector('#share').onclick=shareResult;
  focusTitle();
}
let noticeTimer;
function showNotice(message){const notice=document.querySelector('#notice');notice.textContent=message;notice.classList.remove('hidden');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.classList.add('hidden'),2600);}
async function shareResult(){
  const url=location.origin+location.pathname+resultHash(currentResult.choices);
  try{
    await navigator.clipboard.writeText(url);
    showNotice('Ссылка скопирована');
  }catch(err){
    const input=document.createElement('textarea');
    input.value=url;
    input.style.position='fixed';
    input.style.opacity='0';
    document.body.append(input);
    let copied=false;
    try{input.select();copied=document.execCommand('copy');}
    catch(copyError){copied=false;}
    finally{input.remove();}
    showNotice(copied?'Ссылка скопирована':'Не удалось скопировать ссылку');
  }
}
const sharedChoices=decodeResultHash(location.hash);
const sharedIndex=fairies.findIndex(f=>location.hash==='#'+f.id);
if(sharedChoices)showResult(calculate(sharedChoices),true);
else if(sharedIndex>=0)showResult({winner:sharedIndex},true);
else renderHome();
</script></body></html>
