@import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

ckground:#f4d79a}.primary span{margin-left:23px}.quiz{max-width:760px;margin:auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-bottom:14px}.progress{height:6px;border-radius:20px;overflow:hidden;background:#ffffff18}.progress i{display:block;height:100%;background:linear-gradient(90deg,#ba9456,#f1d38f);transition:width .25s}.qcard,.result-card{margin-top:24px;background:var(--panel);border:1px solid #ffffff20;border-radius:25px;padding:29px;box-shadow:0 22px 52px #050d1830}.qmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--gold);font-weight:800;letter-spacing:.1em;text-transform:uppercase}.icon{display:grid;place-items:center;width:58px;height:58px;background:#ffffff12;border:1px solid #ffffff25;border-radius:18px;font-size:27px;margin:25px 0 14px}.qcard h2{font:700 clamp(22px,3vw,29px)/1.48 Comfortaa,sans-serif;letter-spacing:-.04em;margin:0 0 25px}.options{display:grid;gap:10px}.option{width:100%;text-align:left;display:flex;align-items:center;gap:14px;background:#ffffff08;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.55;transition:background .15s,border-color .15s}.option:hover:not(:disabled){background:#ffffff17;border-color:#c6a366}.option:disabled{opacity:1}.option.correct{border-color:#8dcaa6;background:#2a5a4c77}.option.wrong{border-color:#d6918b;background:#63413e88}.option .num{display:grid;place-items:center;flex:none;width:27px;height:27px;border-radius:50%;background:#ffffff16;color:var(--gold);font-size:11px;font-weight:800}.feedback{margin-top:18px;padding:17px 18px;background:#182b3a;border-left:3px solid var(--gold);border-radius:10px;font-size:13px;line-height:1.7}.feedback strong{color:#f3d795}.feedback a,.review a{color:#eaca88}.feedback p{margin:5px 0}.navigation{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:23px}.navigation span{font-size:12px;color:var(--muted)}.result-card{text-align:center}.result-card .eyebrow{margin-bottom:11px}.result-card h1{font:700 clamp(28px,4vw,43px)/1.3 Comfortaa,sans-serif;letter-spacing:-.04em;margin:10px 0}.points{font:700 clamp(55px,9vw,95px)/1 Comfortaa,sans-serif;letter-spacing:-.09em;color:#f1bccb;margin:28px 0 3px}.points small{font-size:.4em;color:#bcb8ae;letter-spacing:-.04em}.result-card p{color:var(--muted);line-height:1.7}.result-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:27px 0}.secondary{border:1px solid #8e9ba0;background:transparent;color:var(--ink);border-radius:100px;padding:15px 20px;font-weight:700}.secondary:hover{background:#ffffff12}.review{margin-top:25px;text-align:left;border-top:1px solid var(--line);padding-top:20px}.review h2{font:700 19px Comfortaa,sans-serif}.review ol{padding-left:22px}.review li{margin:0 0 18px;line-height:1.6;font-size:13px}.review li strong{display:block;color:#f0d293;margin-top:3px}.notice{position:fixed;left:50%;bottom:24px;z-index:9;transform:translateX(-50%);padding:12px 20px;border-radius:100px;background:#f1bccb;color:#172737;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 12px 28px #0004}.hidden{display:none!important}footer{text-align:center;color:#9fa9ae;font-size:11px;line-height:1.7;padding:0 20px 25px}@media(max-width:600px){.header-row{padding:0 18px}.brand{font-size:15px}.home-link{font-size:11px}main{padding:35px 16px 50px}.hero p{font-size:14px}.emblem{height:165px}.qcard,.result-card{padding:22px 17px}.option{font-size:13px;padding:13px}.navigation{align-items:stretch;flex-direction:column-reverse}.navigation .primary{width:100%}.result-actions{flex-direction:column}.result-actions button{width:100%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus{outline:none}
</style>
</head>
<body>
<header><div class="header-row"><a class="brand" href="./"><span>✦</span>искра алфеи</a><a class="home-link" href="./">← Все квизы</a></div></header>
<main id="app"></main>
<footer>Неофициальный фан-квиз по сериалу Heated Rivalry. Источник — диалоги серий, ссылка после ответа.</footer>
<script src="./heated-rivalry-questions.js"></script>
<script>
'use strict';
const questionById=new Map(questionBank.map(q=>[q.id,q]));
const quizLength=20;
const app=document.querySelector('#app');
let questions=[],optionOrders=[],answers=[],step=0,noticeTimer,resultVersion=1;
const seenStorageKey='alfea.heated.seen.v1';
let seenQuestionIds=new Set();
function readSeenQuestions(){
  try{
    const values=JSON.parse(localStorage.getItem(seenStorageKey)||'[]');
    if(!Array.isArray(values))return seenQuestionIds;
    return new Set(values.filter(id=>Number.isInteger(id)&&questionById.has(id)));
  }catch(error){return seenQuestionIds;}
}
function rememberQuestion(id){
  if(seenQuestionIds.has(id))return;
  seenQuestionIds.add(id);
  try{localStorage.setItem(seenStorageKey,JSON.stringify([...seenQuestionIds]));}catch(error){/* In-memory history still works when storage is unavailable. */}
}
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}return copy;}
function chooseQuestions(){
  seenQuestionIds=readSeenQuestions();
  const candidates=shuffle(questionBank);
  const fresh=candidates.filter(q=>!seenQuestionIds.has(q.id));
  const seen=candidates.filter(q=>seenQuestionIds.has(q.id));
  return shuffle([...fresh,...seen].slice(0,quizLength));
}
function maxPoints(){return questions.reduce((total,q)=>total+q.points,0);}
function renderHome(){
  app.innerHTML=`<section class="hero"><div class="eyebrow">Жаркое соперничество · сезон 1</div><h1>Помнишь больше,<br>чем главные сцены?</h1><p>72 вопроса на детали диалогов, матчей и встреч. Новые задания — для самых внимательных. В каждой попытке — 20 случайных, сначала ещё не встречавшиеся. Только хард: 3 балла за верный ответ.</p><p>Спойлеры ко всем 6 сериям первого сезона.</p><div class="emblem" aria-hidden="true"><svg viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg"><rect x="60" y="15" width="520" height="180" rx="85" fill="#d9ecf0"/><path d="M320 15v180M185 20v170M455 20v170" stroke="#c34863" stroke-width="3"/><circle cx="320" cy="105" r="44" fill="none" stroke="#c34863" stroke-width="3"/><path d="m220 40 140 130h55m5-130L280 170h-55" fill="none" stroke="#203d50" stroke-width="13" stroke-linejoin="round"/><ellipse cx="320" cy="145" rx="21" ry="9" fill="#172c3d"/><text x="115" y="115" fill="#203d50" font-size="28" font-family="sans-serif">24</text><text x="485" y="115" fill="#a62d4b" font-size="28" font-family="sans-serif">81</text></svg></div><div class="stat-row"><span>${questionBank.length.toLocaleString('ru-RU')} вопросов в банке</span><span>20 случайных за попытку</span><span>Ответы с источниками</span></div><button class="primary" id="start">Начать испытание <span>→</span></button></section>`;
  document.querySelector('#start').onclick=startQuiz;
}
function startQuiz(){questions=chooseQuestions();optionOrders=questions.map(()=>shuffle([0,1,2,3]));answers=[];step=0;resultVersion=1;history.replaceState(null,'',location.pathname);renderQuestion();}
function focusTitle(){const title=app.querySelector('h1,h2');title.tabIndex=-1;title.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function renderQuestion(){
  const q=questions[step],chosen=answers[step];
  rememberQuestion(q.id);
  app.innerHTML=`<section class="quiz"><div class="topline"><span>Жаркое соперничество · хард</span><span>Вопрос ${step+1} из ${questions.length}</span></div><div class="progress" role="progressbar" aria-label="Прогресс квиза" aria-valuemin="0" aria-valuemax="${questions.length}" aria-valuenow="${step}"><i style="width:${step/questions.length*100}%"></i></div><div class="qcard"><div class="qmeta"><span>${q.tag}</span><span>${q.points} балла за ответ</span></div><div class="icon" aria-hidden="true">${q.icon}</div><h2>${q.q}</h2><div class="options" role="group" aria-label="Варианты ответа">${optionOrders[step].map((i,visualIndex)=>`<button class="option ${chosen!==undefined?(i===q.answer?'correct':i===chosen?'wrong':''):''}" data-answer="${i}" ${chosen!==undefined?'disabled':''}><span class="num">${visualIndex+1}</span><span>${q.options[i]}</span></button>`).join('')}</div>${chosen!==undefined?`<div class="feedback" role="status"><strong>${chosen===q.answer?`Верно · +${q.points} балла`:'Неверно · +0 баллов'}</strong><p>${q.why}</p><a href="${q.source}" target="_blank" rel="noopener noreferrer">Проверить факт ↗</a></div>`:''}<div class="navigation"><span>${chosen===undefined?'Выбери один ответ':'Ответ принят'}</span><button class="primary" id="next" ${chosen===undefined?'disabled':''}>${step===questions.length-1?'Узнать счёт':'Следующий вопрос'} <span>→</span></button></div></div></section>`;
  if(chosen===undefined)app.querySelectorAll('[data-answer]').forEach(button=>button.onclick=()=>{answers[step]=Number(button.dataset.answer);renderQuestion();});
  document.querySelector('#next').onclick=()=>{if(answers[step]===undefined)return;if(step<questions.length-1){step++;renderQuestion();}else showResult(answers,false);};
  focusTitle();
}
function resultHash(values){
  return '#score=1.'+questions.map((q,i)=>q.id.toString(36)+'-'+values[i]).join('.');
}
function decodeHash(hash){
  if(!hash.startsWith('#score=1.'))return null;
  const entries=hash.slice(9).split('.');
  if(entries.length!==quizLength||entries.some(entry=>!/^([0-9a-z]{1,4})-[0-3]$/.test(entry)))return null;
  const ids=entries.map(entry=>parseInt(entry.split('-')[0],36));
  if(new Set(ids).size!==quizLength||ids.some(id=>!questionById.has(id)))return null;
  return {questions:ids.map(id=>questionById.get(id)),answers:entries.map(entry=>Number(entry.split('-')[1])),version:1};
}
function showNotice(message){const notice=document.querySelector('#notice');notice.textContent=message;notice.classList.remove('hidden');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.classList.add('hidden'),2600);}
function showResult(values,shared){
  answers=[...values];
  const total=values.reduce((score,choice,i)=>score+(choice===questions[i].answer?questions[i].points:0),0);
  const possible=maxPoints();
  const correct=values.filter((choice,i)=>choice===questions[i].answer).length;
  const title=total/possible>=.85?'Видишь игру насквозь':total/possible>=.6?'Знаток скрытых деталей':total/possible>=.35?'Есть повод пересмотреть':'Пора на повторный просмотр';
  const missed=questions.map((q,i)=>({q,choice:values[i]})).filter(({q,choice})=>choice!==q.answer);
  history.replaceState(null,'',resultHash(values));
  app.innerHTML=`<section class="result-card"><div class="eyebrow">${shared?'Результат, которым поделились':'Твой результат'}</div><div class="points">${total}<small> / ${possible}</small></div><h1>${title}</h1><p>Верных ответов: ${correct} из ${questions.length}. ${correct===questions.length?'Ни одной ошибки — это впечатляет!':'Самое интересное прячется в деталях.'}</p><div class="result-actions"><button class="primary" id="share">Скопировать результат <span>↗</span></button><button class="secondary" id="restart">Пройти ещё раз</button>${missed.length?'<button class="secondary" id="review-toggle" aria-expanded="false">Разобрать ошибки</button>':''}</div><div class="notice hidden" id="notice" role="status"></div>${missed.length?`<div class="review hidden" id="review"><h2>Вопросы, где можно было набрать больше</h2><ol>${missed.map(({q})=>`<li>${q.q}<strong>Правильный ответ: ${q.options[q.answer]}</strong><a href="${q.source}" target="_blank" rel="noopener noreferrer">Источник ↗</a></li>`).join('')}</ol></div>`:''}</section>`;
  document.querySelector('#restart').onclick=startQuiz;
  document.querySelector('#share').onclick=shareResult;
  if(missed.length)document.querySelector('#review-toggle').onclick=()=>{const review=document.querySelector('#review'),button=document.querySelector('#review-toggle');review.classList.toggle('hidden');button.setAttribute('aria-expanded',String(!review.classList.contains('hidden')));};
  focusTitle();
}
async function shareResult(){
  const url=location.origin+location.pathname+resultHash(answers);
  try{await navigator.clipboard.writeText(url);showNotice('Ссылка скопирована');}
  catch(err){
    const input=document.createElement('textarea');input.value=url;input.style.position='fixed';input.style.opacity='0';document.body.append(input);
    let copied=false;try{input.select();copied=document.execCommand('copy');}catch(copyError){copied=false;}finally{input.remove();}
    showNotice(copied?'Ссылка скопирована':'Не удалось скопировать ссылку');
  }
}
function renderRoute(){
  const shared=decodeHash(location.hash);
  if(shared){questions=shared.questions;answers=shared.answers;resultVersion=shared.version;showResult(shared.answers,true);}else renderHome();
}
window.addEventListener('hashchange',renderRoute);
renderRoute();
</script>
</body>
</html>
